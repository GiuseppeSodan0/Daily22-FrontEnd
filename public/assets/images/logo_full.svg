<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <!-- Symbol (Nested double 'd' with yellow core) -->
  <g id="logo-symbol">
    <!-- Outer 'd' bowl -->
    <circle cx="20" cy="24" r="12" stroke="#2C2C2E" stroke-width="3" stroke-linecap="round"/>
    <!-- Outer 'd' stem -->
    <path d="M 32 6 L 32 36" stroke="#2C2C2E" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Inner 'd' bowl -->
    <circle cx="20" cy="24" r="7" stroke="#2C2C2E" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Inner 'd' stem -->
    <path d="M 27 13 L 27 31" stroke="#2C2C2E" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- Core yellow dot -->
    <circle cx="20" cy="24" r="3.5" fill="#F2C400"/>
  </g>
  
  <!-- Typography "daily" -->
  <text x="46" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#2C2C2E" letter-spacing="-0.04em">daily</text>
</svg>

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compress images
        run: |
          npm install --no-save sharp
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');

          const dirs = ['public/assets/images', 'src/assets/images'];
          const THRESHOLD = 200 * 1024;

          async function compressImage(filePath) {
            const ext = path.extname(filePath).toLowerCase();
            const stat = fs.statSync(filePath);
            if (stat.size <= THRESHOLD) return null;
            const before = stat.size;
            const buf = fs.readFileSync(filePath);
            let output;
            if (ext === '.png') {
              output = await sharp(buf).png({ quality: 95, compressionLevel: 9, adaptiveFiltering: true }).toBuffer();
            } else if (ext === '.jpg' || ext === '.jpeg') {
              output = await sharp(buf).jpeg({ quality: 75, mozjpeg: true }).toBuffer();
            } else {
              return null;
            }
            if (output.length < before) {
              fs.writeFileSync(filePath, output);
              return { file: path.basename(filePath), before, after: output.length, saved: ((1 - output.length / before) * 100).toFixed(1) };
            }
            return null;
          }

          async function main() {
            let total = 0;
            for (const dir of dirs) {
              if (!fs.existsSync(dir)) continue;
              const files = fs.readdirSync(dir);
              for (const f of files) {
                const fp = path.join(dir, f);
                if (!fs.statSync(fp).isFile()) continue;
                const ext = path.extname(f).toLowerCase();
                if (!['.png', '.jpg', '.jpeg'].includes(ext)) continue;
                try {
                  const result = await compressImage(fp);
                  if (result) {
                    total += result.before - result.after;
                    console.log(result.file + ': ' + (result.before/1024).toFixed(0) + 'KB -> ' + (result.after/1024).toFixed(0) + 'KB (-' + result.saved + '%)');
                  }
                } catch (e) {
                  console.log('Skipped: ' + f + ' (unsupported format)');
                }
              }
            }
            console.log('Total saved: ' + (total/1024).toFixed(0) + 'KB');
          }
          main();
          "

      - name: Commit compressed images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/ src/assets/images/
          git diff --cached --quiet || git commit -m "opt: auto-compress images [skip ci]" && git push

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure nginx location for /firme/
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          ssh-keyscan -H daily22.it >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy/nginx-firme.conf deploy/install-nginx-firme.sh root@daily22.it:/tmp/

          $SSH root@daily22.it "chmod +x /tmp/install-nginx-firme.sh && /tmp/install-nginx-firme.sh daily22.it /tmp/nginx-firme.conf"

          $SSH root@daily22.it "rm -f /tmp/nginx-firme.conf /tmp/install-nginx-firme.sh"

          rm -f ~/.ssh/deploy_key
          echo "nginx location /firme/ installed."

      - name: Restore node app in pm2 if missing
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          ssh-keyscan -H daily22.it >> ~/.ssh/known_hosts 2>/dev/null

          $SSH root@daily22.it "bash -s" <<'EOS'
          if pm2 describe daily22-frontend >/dev/null 2>&1; then
            echo "pm2: daily22-frontend gia' registrato"
          else
            echo "pm2: daily22-frontend non registrato, ripristino dal dump pm2"
            pm2 resurrect || true
          fi
          if ! pm2 describe daily22-frontend >/dev/null 2>&1; then
            if pm2 jlist | grep -q "node-app/server.cjs"; then
              echo "pm2: processo con lo stesso script presente sotto un altro nome"
            else
              echo "pm2: avvio di daily22-frontend"
              pm2 start /var/www/vhosts/daily22.it/node-app/server.cjs --name daily22-frontend --cwd /var/www/vhosts/daily22.it/node-app || true
            fi
          fi
          pm2 list || true
          EOS

          rm -f ~/.ssh/deploy_key

      - name: Deploy via SSH
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          ssh-keyscan -H daily22.it >> ~/.ssh/known_hosts 2>/dev/null

          rsync -avz --delete -e "$SSH" --exclude="server.cjs" --exclude="server.cjs.map" dist/ root@daily22.it:/var/www/vhosts/daily22.it/httpdocs/

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no dist/server.cjs root@daily22.it:/var/www/vhosts/daily22.it/node-app/server.cjs

          $SSH root@daily22.it "cd /var/www/vhosts/daily22.it/node-app && export SMTP_HOST=\"$SMTP_HOST\" SMTP_PORT=\"$SMTP_PORT\" SMTP_USER=\"$SMTP_USER\" SMTP_PASS=\"$SMTP_PASS\" SMTP_SECURE=\"$SMTP_SECURE\" SMTP_FROM=\"$SMTP_FROM\" && pm2 restart daily22-frontend --update-env"

          rm -f ~/.ssh/deploy_key
          echo "Deploy complete! https://daily22.it is live."

      - name: Verify /firme/ resources
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          for f in paolo-mirabella-v2.png daily-logo-orizzontale-v2.png loghi-istituzionali.png; do
            echo "== /firme/$f =="
            curl -sS -o /dev/null -D - "https://daily22.it/firme/$f" | sed -n '1p;/^[Cc]ontent-[Tt]ype:/p;/^[Xx]-[Rr]obots-[Tt]ag:/p;/^[Cc]ontent-[Ll]ength:/p'
          done

# Daily Practice 22 - /blog
location ~ ^/blog(?:/|$) {
    rewrite ^(/blog(?:/[a-z0-9-]+)?)/$ $1 permanent;
    rewrite ^(/blog(?:/[a-z0-9-]+)?)$ /_editorial$1.html last;
    return 404;
}

location ^~ /_editorial/ {
    internal;
    root /var/www/vhosts/daily22.it/httpdocs;
    try_files $uri =404;
}

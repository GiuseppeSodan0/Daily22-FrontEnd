# Daily Practice 22 - /firme/
# Risorse immagine per le firme email. Nessuna pagina, nessuna galleria del personale.
# Installata da deploy/install-nginx-firme.sh (idempotente, validata con nginx -t).
#
# Il server web del sito e' nginx (Plesk): i file .htaccess non vengono letti,
# quindi i vincoli di pubblicazione sono definiti qui.

# La cartella non e' navigabile: nessuna directory listing, nessun index.
location = /firme/ {
    add_header X-Robots-Tag "noindex" always;
    return 404;
}

location ^~ /firme/ {
    # Solo file immagine: qualsiasi altro tipo viene scaricato, non reso come pagina.
    types {
        image/png  png;
        image/jpeg jpg jpeg;
        image/gif  gif;
        image/webp webp;
    }
    default_type application/octet-stream;

    # Nessuna directory listing.
    autoindex off;

    # Riduce la reperibilita' senza impedire il caricamento nei client email:
    # nessuna autenticazione, nessuna protezione anti-hotlink, nessuna scadenza.
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Expires "Wed, 11 Jan 2034 00:00:00 GMT" always;

    # Restituisce il file immagine reale; 404 se non esiste.
    try_files $uri =404;
}
